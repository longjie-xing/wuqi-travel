# 首页：倒计时、航班主信息、延误顺延文案、今日待办
# 回归：2026-11-17 真机 11/NaN bug —— 延误卡片绝不能出现 NaN
# 注意：Maestro 的 assertVisible/tapOn 按节点全文精确匹配，
# 断言必须写完整节点文本，子串会失败（2026-11-18 第五遍 CI 实测：
# “CA1831 · 11/21 09:15 起飞”是长节点的前半段，断言失败）。
appId: com.wuqi.travel
---
- launchApp:
    clearState: true
# 若系统桌面（Pixel Launcher）无响应弹窗盖住了 App，点“Wait”消掉再继续；
# 没弹窗时这一步直接跳过（第六遍 CI：弹窗盖住屏幕导致 5 个 flow 全败）。
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible:
      text: "距登机还有"
    timeout: 30000
# 倒计时标题与航班主信息（完整节点文本）
- assertVisible:
    text: "CA1831 · 11/21 09:15 起飞（原 08:35，延误 40 分钟）· 登机口 C18 · 座位 18A"
# 延误顺延文案：出发提醒 11/21 06:15 / 11/21 08:15（-3h / -1h），
# 两个时间都在同一长节点里，断言写整段
- assertVisible:
    text: "CA1831 延误 40 分钟，起飞 09:15，登机口由 C12 变更为 C18。后续提醒已自动顺延： 出发提醒 11/21 06:15 / 11/21 08:15，值机 11/20 09:15 开放。"
# 回归断言：文案里绝不能出现 NaN
- assertNotVisible:
    text: "NaN"
# 今日待办
- assertVisible:
    text: "今日待办 · 11/21 周六"
- assertVisible:
    text: "• 09:15 CA1831 · 北京大兴 → 三亚凤凰"
- takeScreenshot: home
